name: Test typos detected - action should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with typos
        run: |
          echo "teh quick brown fox" > typo.txt

      - id: action
        uses: .
        with:
          files: typo.txt
          isolated: "true"
        continue-on-error: true
        env:
          INSTALL_DIR: /tmp/typos-bin

      - name: Assert action failed due to typos
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when typos are present, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when typos were detected"
