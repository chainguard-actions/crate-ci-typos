name: Test typos detected - action fails on typos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with typos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/typos"
          # "teh" is a well-known typo for "the"
          printf 'teh quick brown fox\n' > "$GITHUB_WORKSPACE/tests/fixtures/typos/bad.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/typos
          isolated: true

      - name: Assert action failed due to typos
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when typos are present, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when typos were detected"
