name: Test typos detection - typos found should cause failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with a known typo
        run: |
          mkdir -p /tmp/test-typos
          # "teh" is a known typo for "the"
          echo "teh quick brown fox" > /tmp/test-typos/typo.txt

      - name: Run typos action and expect failure
        id: action
        uses: .
        with:
          files: /tmp/test-typos
          isolated: "true"
        continue-on-error: true

      - name: Assert action failed due to typos
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when typos are present, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when typos were detected"
