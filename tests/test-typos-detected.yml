name: Test typos detection - files with typos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create file with known typos
        run: |
          mkdir -p /tmp/typos-test
          # "teh" is a well-known typo for "the"
          echo "teh quick brown fox" > /tmp/typos-test/typos.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/typos-test/typos.txt
          isolated: true

      - name: Assert action failed due to typos
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when typos were found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when typos were present"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
