name: Test typo detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with known typos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-tmp/typos"
          # "teh" is a well-known typo for "the"
          echo "teh quick brown fox" > "$GITHUB_WORKSPACE/test-tmp/typos/typo.txt"
          echo "Created file:"
          cat "$GITHUB_WORKSPACE/test-tmp/typos/typo.txt"

      - name: Run typos action and expect failure
        id: action
        uses: .
        with:
          files: "${{ github.workspace }}/test-tmp/typos/typo.txt"
          isolated: true
        continue-on-error: true

      - name: Assert action detected typos (exit code non-zero)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when typos are present, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected typos and failed"
