name: Test typo detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with typos
        run: |
          mkdir -p /tmp/typos-test-typo
          # "teh" is a well-known typo for "the"
          echo "teh quick brown fox" > /tmp/typos-test-typo/typo.txt

      - name: Run action and expect failure
        id: action
        uses: .
        with:
          files: /tmp/typos-test-typo
        continue-on-error: true

      - name: Assert action failed due to typos
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to typos, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected typos and failed"
