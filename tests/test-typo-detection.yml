name: Test typo detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with known typos
        run: |
          mkdir -p /tmp/typos-test
          cat > /tmp/typos-test/typos.txt << 'EOF'
          This file has a typo: teh quick brown fox.
          Also: recieve is misspelled.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/typos-test/typos.txt
          isolated: true

      - name: Assert action failed (typos were found)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected typos and exited with failure"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to typos but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
