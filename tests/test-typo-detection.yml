name: Test typo detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run typos action on fixture file with known typo
        id: action
        uses: .
        with:
          files: tests/fixtures/typo.txt
          isolated: true
        continue-on-error: true

      - name: Assert action failed due to typos
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when typos are present, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected typos and failed"
