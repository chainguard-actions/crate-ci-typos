name: Test typo detection - typos found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with a known typo
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/typos"
          # "teh" is a well-known typo for "the" that typos detects
          cat > "$GITHUB_WORKSPACE/tests/fixtures/typos/bad.md" <<'EOF'
          # Bad File
          This is teh file with a typo.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/typos
          isolated: "true"

      - name: Assert action failed (typos detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected typos and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to typos but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
