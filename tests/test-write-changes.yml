name: Test write changes - auto-fix typos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with a known typo
        run: |
          mkdir -p /tmp/typos-test-write
          # "teh" is a well-known typo for "the"
          printf 'teh quick brown fox\n' > /tmp/typos-test-write/fixme.txt
          echo "Before fix:"
          cat /tmp/typos-test-write/fixme.txt

      - id: action
        name: Run typos with write_changes enabled
        uses: .
        with:
          files: /tmp/typos-test-write
          isolated: "true"
          write_changes: "true"

      - name: Assert typo was fixed in the file
        run: |
          echo "After fix:"
          cat /tmp/typos-test-write/fixme.txt
          if grep -q "teh" /tmp/typos-test-write/fixme.txt; then
            echo "FAIL: typo 'teh' was not fixed"
            exit 1
          fi
          if grep -q "the" /tmp/typos-test-write/fixme.txt; then
            echo "PASS: typo was corrected to 'the'"
          else
            echo "FAIL: expected 'the' in fixed file"
            exit 1
          fi
