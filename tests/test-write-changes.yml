name: Test write_changes - auto-correct typos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture to writable temp location
        run: |
          mkdir -p /tmp/typos-write-test
          cp "$GITHUB_WORKSPACE/tests/fixtures/typo.txt" /tmp/typos-write-test/typo.txt
          echo "Before fix:"
          cat /tmp/typos-write-test/typo.txt

      - id: action
        uses: .
        with:
          files: /tmp/typos-write-test/typo.txt
          isolated: true
          write_changes: true

      - name: Assert typo was corrected in the file
        run: |
          echo "After fix:"
          cat /tmp/typos-write-test/typo.txt
          if grep -q "teh" /tmp/typos-write-test/typo.txt; then
            echo "FAIL: typo 'teh' was not corrected"
            exit 1
          fi
          if grep -q "the" /tmp/typos-write-test/typo.txt; then
            echo "PASS: typo was corrected to 'the'"
          else
            echo "FAIL: expected 'the' in corrected file"
            exit 1
          fi
