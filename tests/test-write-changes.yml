name: Test write_changes mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with a known typo
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/write-changes"
          # "teh" is a well-known typo for "the"
          echo "teh quick brown fox" > "$GITHUB_WORKSPACE/tests/fixtures/write-changes/fix.txt"

      - id: action
        uses: .
        with:
          files: tests/fixtures/write-changes
          isolated: true
          write_changes: true

      - name: Assert typo was corrected in the file
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/fixtures/write-changes/fix.txt")
          echo "file content: $CONTENT"
          if echo "$CONTENT" | grep -q "^the "; then
            echo "PASS: typo was corrected from 'teh' to 'the'"
          else
            echo "FAIL: expected typo to be corrected, got: $CONTENT"
            exit 1
          fi
