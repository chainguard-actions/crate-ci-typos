name: Test isolated mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files
        run: |
          mkdir -p /tmp/typos-isolated-test
          echo "This file has correct spelling throughout." > /tmp/typos-isolated-test/sample.txt
          echo "All words are spelled correctly here." >> /tmp/typos-isolated-test/sample.txt

      - id: action
        uses: .
        with:
          files: /tmp/typos-isolated-test/sample.txt
          isolated: true

      - name: Assert action succeeded in isolated mode
        run: |
          echo "PASS: typos action completed successfully in isolated mode"
