name: Test isolated mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files for isolated mode
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/isolated"
          # A clean file to check
          echo "Hello world. This is a clean file." > "$GITHUB_WORKSPACE/tests/fixtures/isolated/clean.txt"

      - id: action
        uses: .
        with:
          files: tests/fixtures/isolated
          isolated: true

      - name: Assert action succeeded in isolated mode
        run: |
          echo "PASS: action completed successfully in isolated mode"
