name: Test basic usage - no typos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with no typos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/hello.txt" << 'EOF'
          Hello world. This is a clean file with correct spelling.
          The quick brown fox jumps over the lazy dog.
          EOF

      - id: action
        uses: .
        with:
          files: tests/fixtures/clean
          isolated: true

      - name: Assert action succeeded
        run: |
          echo "PASS: typos action completed successfully with no typos found"
