name: Test extend_words - custom words not flagged
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          files: ${{ github.workspace }}/tests/fixtures/custom-words.txt
          isolated: true
          extend_words: "codebase"

      - name: Assert action succeeded with extended words
        run: |
          echo "PASS: action completed successfully with extended words"
