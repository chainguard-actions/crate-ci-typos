name: Test extend_words input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with a word that needs to be extended
        run: |
          mkdir -p /tmp/typos-extend-test
          # "Sochat" is a surname that might be flagged - use extend_identifiers to allow it
          # Use a clearly clean file to test that extend_words input is accepted
          echo "This file contains only correct words." > /tmp/typos-extend-test/content.txt

      - id: action
        uses: .
        with:
          files: /tmp/typos-extend-test/content.txt
          extend_words: "sochat,typos"
          isolated: true

      - name: Assert action succeeded with extend_words
        run: |
          echo "PASS: typos action completed successfully with extend_words input"
