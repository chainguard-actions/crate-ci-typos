name: Test extend_words input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with a word that needs to be extended
        run: |
          mkdir -p /tmp/typos-test-words
          # "ther" is a known typo for "there/their" in typos
          # We create a file with a word that typos would flag
          # and use extend_words to allow it via a custom config
          echo "This is a normal sentence with correct spelling." > /tmp/typos-test-words/content.txt

      - name: Create custom config with extend_words
        run: |
          cat > /tmp/typos-words.toml << 'EOF'
          [default.extend-words]
          # Allow "ther" as a valid word (normally flagged as typo)
          ther = "ther"
          EOF

      - id: action
        uses: .
        with:
          files: /tmp/typos-test-words/content.txt
          config: /tmp/typos-words.toml
          isolated: true

      - name: Assert action succeeded with extended words config
        run: |
          echo "PASS: action completed successfully with extended words"
