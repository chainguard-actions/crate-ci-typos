name: Test extend_words input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with a custom word that typos would flag
        run: |
          mkdir -p /tmp/typos-test-extend-words
          # "ackward" would normally be flagged as a typo for "awkward",
          # but we'll use a clearly custom/invented word that typos might flag.
          # We use "wrd" which typos flags as a typo for "word".
          # By adding it to extend_words, it should be accepted.
          echo "This is a wrd used as a custom identifier." > /tmp/typos-test-extend-words/sample.txt

      - id: action
        uses: .
        with:
          files: /tmp/typos-test-extend-words/sample.txt
          extend_words: "wrd"
          isolated: true

      - name: Assert action succeeded with extend_words
        run: |
          echo "Action completed successfully with extend_words input"
          echo "PASS: extend_words input accepted and typos did not flag the custom word"
