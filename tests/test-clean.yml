name: Test clean files pass
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          files: tests/fixtures/clean
          isolated: "true"
      - name: Assert success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL"
            exit 1
          fi
          if [ ! -x "$RUNNER_TEMP/typos" ]; then
            echo "FAIL: typos binary not installed in RUNNER_TEMP"
            exit 1
          fi
          echo "PASS"
