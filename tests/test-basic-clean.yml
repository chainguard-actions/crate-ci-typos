name: Test basic usage - clean files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean test file
        run: |
          mkdir -p /tmp/typos-test
          echo "This is a clean file with no spelling errors." > /tmp/typos-test/clean.txt
          echo "The quick brown fox jumps over the lazy dog." >> /tmp/typos-test/clean.txt

      - id: action
        uses: .
        with:
          files: /tmp/typos-test/clean.txt
          isolated: true

      - name: Assert action succeeded on clean files
        run: |
          echo "PASS: typos action completed successfully on clean files"
