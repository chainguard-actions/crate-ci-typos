name: Test basic usage - clean files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean file with no typos
        run: |
          mkdir -p /tmp/typos-test-clean
          cat > /tmp/typos-test-clean/clean.txt << 'EOF'
          This is a clean file with correct spelling.
          There are no typos here.
          Everything looks good.
          EOF

      - id: action
        name: Run typos on clean file
        uses: .
        with:
          files: /tmp/typos-test-clean
          isolated: "true"

      - name: Assert action succeeded (no typos found)
        run: |
          echo "PASS: typos action completed successfully on clean files"
