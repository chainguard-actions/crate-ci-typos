name: Test typo is detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure jq and wget are available
        run: |
          if ! command -v jq >/dev/null || ! command -v wget >/dev/null; then
            sudo apt-get update && sudo apt-get install -y jq wget || apt-get update && apt-get install -y jq wget
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/typo.txt
          isolated: "true"
      - name: Assert action failed on typo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to typo"
            exit 1
          fi
          if [ ! -x "$RUNNER_TEMP/typos" ]; then
            echo "FAIL: typos binary not installed (failure was not from typo check)"
            exit 1
          fi
          if "$RUNNER_TEMP/typos" --isolated tests/fixtures/typo.txt; then
            echo "FAIL: typos binary did not detect the typo"
            exit 1
          fi
          grep -q "recieve" tests/fixtures/typo.txt || { echo "FAIL: file was modified"; exit 1; }
          echo "PASS"
