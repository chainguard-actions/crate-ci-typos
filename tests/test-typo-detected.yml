name: Test typos are detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/typo
          isolated: "true"
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected typos to be detected"
            exit 1
          fi
          if ! grep -qw teh tests/fixtures/typo/typo.txt; then
            echo "FAIL: file should not be modified without write_changes"
            exit 1
          fi
          echo "PASS"
