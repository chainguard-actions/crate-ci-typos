name: Test typo detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with a known typo
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/typo"
          # "teh" is a well-known typo for "the"
          echo "teh quick brown fox" > "$GITHUB_WORKSPACE/tests/fixtures/typo/bad.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/typo
          isolated: true

      - name: Assert action detected the typo (non-zero exit)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected typo and exited non-zero"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have detected typo but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
