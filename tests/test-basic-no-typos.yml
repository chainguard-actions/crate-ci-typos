name: Test basic usage - no typos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with no typos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-tmp/basic"
          echo "This is a correct sentence with no spelling errors." > "$GITHUB_WORKSPACE/test-tmp/basic/clean.txt"
          echo "The quick brown fox jumps over the lazy dog." >> "$GITHUB_WORKSPACE/test-tmp/basic/clean.txt"
          echo "Created file:"
          cat "$GITHUB_WORKSPACE/test-tmp/basic/clean.txt"

      - id: action
        uses: .
        with:
          files: "${{ github.workspace }}/test-tmp/basic/clean.txt"
          isolated: true

      - name: Assert action succeeded
        run: |
          echo "PASS: typos action completed without errors on clean file"
