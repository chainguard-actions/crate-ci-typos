name: Test basic usage - no typos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with no typos
        run: |
          mkdir -p /tmp/typos-test-clean
          echo "This is a clean file with no spelling errors." > /tmp/typos-test-clean/clean.txt
          echo "The quick brown fox jumps over the lazy dog." >> /tmp/typos-test-clean/clean.txt

      - id: action
        uses: .
        with:
          files: /tmp/typos-test-clean

      - name: Assert action succeeded (no typos found)
        run: |
          echo "PASS: action completed without errors (no typos found)"
