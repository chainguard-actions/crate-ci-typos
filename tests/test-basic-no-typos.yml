name: Test basic usage - no typos
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean file with no typos
        run: |
          mkdir -p /tmp/typos-test
          cat > /tmp/typos-test/clean.txt << 'EOF'
          This is a clean file with correct spelling.
          There are no typos here.
          Everything looks good.
          EOF

      - id: action
        uses: .
        with:
          files: /tmp/typos-test/clean.txt
          isolated: true

      - name: Assert action succeeded (no typos found)
        run: |
          echo "PASS: action completed without finding typos"
