name: Test basic usage - no typos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run typos action on clean fixture file
        id: action
        uses: .
        with:
          files: tests/fixtures/clean.txt
          isolated: true

      - name: Assert action succeeded
        run: |
          echo "PASS: typos action completed successfully on clean file"
