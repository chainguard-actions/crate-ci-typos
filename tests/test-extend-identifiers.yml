name: Test extend_identifiers input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with clean content
        run: |
          echo "This is a perfectly correct sentence." > content.txt

      - id: action
        uses: .
        with:
          files: content.txt
          extend_identifiers: "Sochat,Vanessa"
          isolated: "true"
        env:
          INSTALL_DIR: /tmp/typos-bin

      - name: Assert action succeeded with extended identifiers
        run: |
          echo "PASS: typos action completed successfully with extended identifiers"
