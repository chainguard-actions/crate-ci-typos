name: Test extend identifiers
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with a word that looks like a typo but is an identifier
        run: |
          mkdir -p /tmp/typos-identifiers
          # "Sochat" is a name that might be flagged as a typo
          # We extend identifiers to allow it
          cat > /tmp/typos-identifiers/names.txt << 'EOF'
          Author: Vanessa Sochat
          This file references a person's name.
          EOF

      - id: action
        uses: .
        with:
          files: /tmp/typos-identifiers/names.txt
          isolated: true
          extend_identifiers: Sochat

      - name: Assert action succeeded with extended identifiers
        run: |
          echo "PASS: action completed successfully with extended identifiers"
