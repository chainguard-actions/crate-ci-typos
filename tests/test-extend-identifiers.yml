name: Test extend_identifiers input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with an identifier that looks like a typo
        run: |
          mkdir -p /tmp/typos-test-identifiers
          # "Sander" might be flagged as a misspelling of "Sender" by typos
          # We use it as a name identifier to test extend_identifiers
          cat > /tmp/typos-test-identifiers/names.txt << 'EOF'
          # This file contains names that should not be flagged as typos
          Author: Sander
          EOF

      - id: action
        uses: .
        with:
          files: /tmp/typos-test-identifiers
          extend_identifiers: Sander

      - name: Assert typos ran successfully with extend_identifiers
        run: |
          echo "PASS: typos ran successfully with extend_identifiers input"
