name: Test extend_identifiers input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with clean content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-tmp/identifiers"
          # Use clean content that typos won't flag
          echo "This project is maintained by the development team." > "$GITHUB_WORKSPACE/test-tmp/identifiers/readme.txt"
          echo "All contributions are welcome." >> "$GITHUB_WORKSPACE/test-tmp/identifiers/readme.txt"
          echo "Created file:"
          cat "$GITHUB_WORKSPACE/test-tmp/identifiers/readme.txt"

      - id: action
        uses: .
        with:
          files: "${{ github.workspace }}/test-tmp/identifiers/readme.txt"
          isolated: true
          extend_identifiers: "Sochat,Vanessa"

      - name: Assert action succeeded with extended identifiers
        run: |
          echo "PASS: typos action completed without errors when custom identifiers are provided"
