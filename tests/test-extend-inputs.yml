name: Test extend_identifiers and extend_words inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          files: tests/fixtures/clean/clean.txt
          isolated: true
          extend_identifiers: "Sochat,Vanessa"
          extend_words: "foobaz,quxly"
      - name: Assert action succeeded with extend inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when extend inputs are passed"
            exit 1
          fi
          echo "PASS"
