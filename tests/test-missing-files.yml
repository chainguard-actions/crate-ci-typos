name: Test missing files error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run typos on a non-existent file
        id: typos-check
        uses: .
        with:
          files: /tmp/nonexistent-path-that-does-not-exist/file.txt
        continue-on-error: true

      - name: Assert action failed for missing files
        env:
          OUTCOME: ${{ steps.typos-check.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when files are missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when files were not found"
