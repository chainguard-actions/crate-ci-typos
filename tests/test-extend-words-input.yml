name: Test extend_words input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file with correct spelling
        run: |
          mkdir -p /tmp/typos-test-extwords
          echo "This is a normal sentence with correct spelling." > /tmp/typos-test-extwords/content.txt

      - id: action
        uses: .
        with:
          files: /tmp/typos-test-extwords/content.txt
          extend_words: "ther,teh"
          isolated: true

      - name: Assert action succeeded with extend_words input
        run: |
          echo "PASS: action completed successfully with extend_words input"
