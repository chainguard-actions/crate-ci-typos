name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files and custom config
        run: |
          mkdir -p /tmp/typos-test-config

          # Create a file with a word that would normally be flagged
          cat > /tmp/typos-test-config/sample.txt << 'EOF'
          This is a clean sample file.
          No spelling errors here.
          EOF

          # Create a custom typos config that extends the default
          cat > /tmp/typos-test-config/typos.toml << 'EOF'
          [default]
          extend-ignore-identifiers-re = []

          [files]
          extend-exclude = []
          EOF

      - id: action
        name: Run typos with custom config file
        uses: .
        with:
          files: /tmp/typos-test-config/sample.txt
          config: /tmp/typos-test-config/typos.toml

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: typos action completed successfully with custom config file"
