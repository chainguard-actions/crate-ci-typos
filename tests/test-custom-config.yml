name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom config and test file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-tmp/custom-config"

          # Create a custom typos config that extends a word (allows "ther" as valid)
          cat > "$GITHUB_WORKSPACE/test-tmp/custom-config/typos.toml" << 'EOF'
          [default.extend-words]
          ther = "ther"
          EOF

          # Create a file using the custom-allowed word
          echo "ther is a custom identifier used in this project" > "$GITHUB_WORKSPACE/test-tmp/custom-config/test.txt"
          echo "Created files:"
          cat "$GITHUB_WORKSPACE/test-tmp/custom-config/test.txt"

      - id: action
        uses: .
        with:
          files: "${{ github.workspace }}/test-tmp/custom-config/test.txt"
          config: "${{ github.workspace }}/test-tmp/custom-config/typos.toml"
          isolated: true

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: typos action completed without errors using custom config"
