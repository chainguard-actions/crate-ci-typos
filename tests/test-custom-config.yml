name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom config and test files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp"
          printf '[default.extend-words]\nteh = "teh"\n' > "$GITHUB_WORKSPACE/tests/tmp/typos.toml"
          echo "This is teh file with a custom config." > "$GITHUB_WORKSPACE/tests/tmp/custom.txt"

      - name: Run typos action with custom config
        id: action
        uses: .
        with:
          files: tests/tmp/custom.txt
          config: tests/tmp/typos.toml
          isolated: true

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: typos action completed successfully with custom config that allows 'teh'"
