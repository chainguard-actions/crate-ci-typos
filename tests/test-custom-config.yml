name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          files: ${{ github.workspace }}/tests/fixtures/custom-word.txt
          isolated: true
          config: ${{ github.workspace }}/tests/fixtures/typos.toml

      - name: Assert action succeeded using custom config
        run: |
          echo "PASS: action completed successfully using custom config"
