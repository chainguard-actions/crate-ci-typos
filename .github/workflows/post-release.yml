# The way this works is the following:
#
# The create-release job runs purely to initialize the GitHub release itself
# and to output upload_url for the following job.
#
# The build-release job runs only once create-release is finished. It gets the
# release upload URL from create-release job outputs, then builds the release
# executables for each supported platform and attaches them as release assets
# to the previously created release.
#
# The key here is that we create the release only once.
#
# Reference:
# https://eugene-babichenko.github.io/blog/2020/05/09/github-actions-cross-platform-auto-releases/

name: post-release
on:
  push:
    tags:
    - "v*.*.*"
    - "!varcon*"

env:
  BIN_NAME: typos

# We need this to be able to create releases.
permissions:
  contents: write

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.TAG }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 1
    - name: Get the release version from the tag
      if: env.TAG == ''
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        safe_tag=$(printf '%s' "$REF_NAME" | tr -d '\n\r')
        echo "TAG=$safe_tag" >> "$GITHUB_ENV"
    - name: Show the tag
      run: |
        echo "tag is: $TAG"
    - name: Generate Release Notes
      run: |
        ./.github/workflows/release-notes.py --tag "$TAG" --output "notes-${TAG}.md"
        cat "notes-${TAG}.md"
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "notes-${TAG}.md"
  build-release:
    name: build-release
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        build: [linux, linux-aarch64, macos, macos-aarch64, win-msvc]
        include:
        - build: linux
          os: ubuntu-22.04
          rust: stable
          target: x86_64-unknown-linux-musl
        - build: linux-aarch64
          os: ubuntu-24.04-arm
          rust: stable
          target: aarch64-unknown-linux-musl
        - build: macos
          os: macos-latest
          rust: stable
          target: x86_64-apple-darwin
        - build: macos-aarch64
          os: macos-latest
          rust: stable
          target: aarch64-apple-darwin
        - build: win-msvc
          os: windows-2022
          rust: stable
          target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 1
    - name: Install packages (Ubuntu)
      if: matrix.build == 'linux' || matrix.build == 'linux-aarch64'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xz-utils liblz4-tool musl-tools
    - name: Install Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: ${{ matrix.rust }}
        targets: ${{ matrix.target }}
    - name: Build release binary
      env:
        MATRIX_TARGET: ${{ matrix.target }}
      run: cargo build --target "$MATRIX_TARGET" --verbose --release
    - name: Build archive
      shell: bash
      env:
        MATRIX_TARGET: ${{ matrix.target }}
        MATRIX_OS: ${{ matrix.os }}
        RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      run: |
        outdir="./target/${MATRIX_TARGET}/release"
        staging="${BIN_NAME}-${RELEASE_TAG}-${MATRIX_TARGET}"
        mkdir -p "$staging"/doc
        cp {README.md,LICENSE-*} "$staging/"
        cp {CHANGELOG.md,docs/*} "$staging/doc/"
        if [ "$MATRIX_OS" = "windows-2022" ]; then
          cp "target/${MATRIX_TARGET}/release/${BIN_NAME}.exe" "$staging/"
          ls -l "$staging"
          cd "$staging"
          7z a "../$staging.zip" .
          safe_asset=$(printf '%s' "$staging.zip" | tr -d '\n\r')
          echo "ASSET=$safe_asset" >> "$GITHUB_ENV"
        else
          cp "target/${MATRIX_TARGET}/release/${BIN_NAME}" "$staging/"
          ls -l "$staging"
          tar czf "$staging.tar.gz" -C "$staging" .
          safe_asset=$(printf '%s' "$staging.tar.gz" | tr -d '\n\r')
          echo "ASSET=$safe_asset" >> "$GITHUB_ENV"
        fi
    - name: Upload release archive
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      shell: bash
      run: |
        gh release upload "$RELEASE_TAG" "$ASSET"
  publish-release:
    name: Publish Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 1
    - name: Publish Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      run: gh release edit "$RELEASE_TAG" --draft=false
    - name: Update major tag
      uses: rickstaa/action-update-semver@77e8cb0f3cd805b38ffe25c07236336e05dcb4da # v1
      with:
        major_version_tag_only: true
